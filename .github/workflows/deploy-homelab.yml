name: Deploy homelab

# Manual release only. The previous `workflow_run` trigger auto-deployed after
# a successful CI run on `main`; that is intentionally removed while the release
# readiness gate is NO-GO. A human must now dispatch one of the controlled modes.
#
# The dispatch still validates that the requested commit is an ancestor of
# `main`, has a successful CI run on `main`, and that the job runs from
# `refs/heads/main` on the self-hosted runner. Automatic CI on pushes is
# unaffected.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA on main to release (must have a successful CI run)"
        required: true
        type: string
      mode:
        description: "verify = read-only checks, dry-run = backup + image build, deploy = full release"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - dry-run
          - deploy

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    # Only workflow_dispatch can reach this workflow now.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve and validate commit
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = String(context.payload.inputs?.mode || 'verify');

            const raw = String(context.payload.inputs?.sha || '').trim().toLowerCase();
            if (!/^[0-9a-f]{7,40}$/.test(raw)) {
              core.setFailed('Input must be a 7-40 character lowercase hex commit SHA');
              return;
            }
            let sha = raw;
            if (raw.length < 40) {
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: raw });
              sha = commit.data.sha;
            }
            core.info(`Resolved commit: ${sha} (mode: ${mode})`);

            const cmp = await github.rest.repos.compareCommits({
              owner, repo, base: 'main', head: sha,
            });
            if (!['identical', 'behind'].includes(cmp.data.status)) {
              core.setFailed(`Commit ${sha} is not an ancestor of main (compare status: ${cmp.data.status})`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 20,
            });
            const green = runs.data.workflow_runs.some(
              (r) => r.conclusion === 'success' && r.head_branch === 'main'
            );
            if (!green) {
              core.setFailed(`No successful CI run on main for ${sha}`);
              return;
            }
            core.info('CI run on main: success');
            core.setOutput('sha', sha);
            core.setOutput('mode', mode);

  deploy:
    name: Release to homelab-testing
    needs: validate
    runs-on: [self-hosted, linux, x64, eduvark-deploy]
    environment:
      name: homelab-testing
      url: https://pam.sequein.my.id
    timeout-minutes: 30
    steps:
      # No actions/checkout in this job. The runner must never execute code
      # from the repository workspace; only the root-owned deployment script
      # is allowed to run, and it re-validates the commit itself.
      - name: Refuse untrusted repository or ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mamaydev/edu-vark"
          test "${GITHUB_REF}" = "refs/heads/main"
          # The engine is root:root 0750, so the runner cannot test -x it.
          # Verify ownership/mode instead; execution goes through sudo.
          test "$(stat -c '%U %a' /usr/local/sbin/eduvark-deploy)" = "root 750"
          test "$(id -u)" -ne 0
          echo "Guards passed on $(hostname) as $(id -un)"

      - name: Run deployment engine
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          DEPLOY_MODE: ${{ needs.validate.outputs.mode }}
        run: |
          set -euo pipefail
          test "${#RELEASE_SHA}" -eq 40
          echo "mode=${DEPLOY_MODE} sha=${RELEASE_SHA}"
          case "$DEPLOY_MODE" in
            verify)  sudo -n /usr/local/sbin/eduvark-deploy verify  "$RELEASE_SHA" ;;
            dry-run) sudo -n /usr/local/sbin/eduvark-deploy dry-run "$RELEASE_SHA" ;;
            deploy)  sudo -n /usr/local/sbin/eduvark-deploy deploy  "$RELEASE_SHA" ;;
            *) echo "unknown mode: $DEPLOY_MODE" >&2; exit 1 ;;
          esac

      - name: Show deployment status
        if: always()
        shell: bash
        run: sudo -n /usr/local/sbin/eduvark-deploy status || true

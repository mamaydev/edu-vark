name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships the Android command line tools. Do not use
      # android-actions/setup-android here: it invokes `sdkmanager tools`, a
      # package that no longer exists in the Google repository, and the job
      # fails before the project is built.
      - name: Install required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - name: Compile, test, lint, and package
        run: |
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eduvark-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eduvark_test
          POSTGRES_USER: eduvark
          POSTGRES_PASSWORD: eduvark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduvark -d eduvark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eduvark:eduvark@localhost:5432/eduvark_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  backend-image:
    name: Backend image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t "eduvark-backend:${GITHUB_SHA::12}" ./backend
      - name: Inspect image
        run: docker image inspect "eduvark-backend:${GITHUB_SHA::12}" --format '{{.Id}} {{.Config.User}}'